"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$python\
$docker_context\
$time\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:mauve fg:crust"
format = "[](fg:mauve)[$symbol]($style)"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[username]
show_always = true
style_user = "bg:mauve fg:crust"
style_root = "bg:red fg:crust"
format = '[$user ]($style)[](fg:mauve) '

[directory]
style = "bg:peach fg:crust"
format = "[](fg:peach)[ $path ]($style)[](fg:peach) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = "[](fg:yellow)[$symbol $branch]($style)"

[git_status]
style = "bg:yellow fg:crust"
format = '[ $all_status$ahead_behind]($style)[](fg:yellow) '

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = "[](fg:green)[$symbol ($version) ]($style)[](fg:green) "

[bun]
symbol = ""
style = "bg:green fg:crust"
format = "[](fg:green)[$symbol ($version) ]($style)[](fg:green) "

[c]
symbol = ""
style = "bg:green fg:crust"
format = "[](fg:green)[$symbol ($version) ]($style)[](fg:green) "

[rust]
symbol = ""
style = "bg:maroon fg:crust"
format = "[](fg:maroon)[$symbol ($version) ]($style)[](fg:maroon) "

[golang]
symbol = ""
style = "bg:sapphire fg:crust"
format = "[](fg:sapphire)[$symbol ($version) ]($style)[](fg:sapphire) "

[python]
symbol = ""
style = "bg:teal fg:crust"
format = "[](fg:teal)[$symbol ($version) ]($style)[](fg:teal) "

[docker_context]
symbol = ""
style = "bg:blue fg:crust"
format = "[](fg:blue)[$symbol $context ]($style)[](fg:blue) "

[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = "[](fg:lavender)[ $time ]($style)[](fg:lavender) "

[cmd_duration]
show_milliseconds = false
style = "bg:surface0 fg:text"
format = "[](fg:surface0)[󰔚 $duration ]($style)[](fg:surface0) "
disabled = false
min_time = 2000

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green) '
error_symbol = '[❯](bold fg:red) '
vimcmd_symbol = '[❮](bold fg:green) '

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
